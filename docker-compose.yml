x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Compañero obligatorio de php_admin_value[memory_limit] = -1: acota la
    # memoria de una petición desbocada al contenedor en vez de dejar que el
    # OOM killer del host elija víctima (mysql, qdrant...). Ajustar al host.
    mem_limit: 1536m
    volumes:
        - ./.env:/var/www/html/.env
        - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: devjourney
      DB_USERNAME: devjourney
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      # Keep above the queue worker --timeout (300s) to avoid duplicate jobs.
      REDIS_QUEUE_RETRY_AFTER: 360
      REDIS_HOST: redis
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
      # Vector DB (Qdrant) para embeddings/búsqueda semántica.
      QDRANT_HOST: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.devjourney.rule=Host(`iabackendjourney.com`)"
        - "traefik.http.routers.devjourney.entrypoints=websecure"
        - "traefik.http.routers.devjourney.tls.certresolver=le"
        - "traefik.http.services.devjourney.loadbalancer.server.port=8000"
        - "traefik.http.routers.devjourney-http.rule=Host(`iabackendjourney.com`)"
        - "traefik.http.routers.devjourney-http.entrypoints=web"
        - "traefik.http.routers.devjourney-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: devjourney
      MYSQL_USER: devjourney
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}

  # Vector database para búsqueda semántica por embeddings.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Recomendado en producción: proteger el acceso aunque no se exponga.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}

  # Reverse proxy con HTTPS automático (Let's Encrypt) para tu dominio de Hostinger
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  portainer:
      image: portainer/portainer-ce:latest
      restart: unless-stopped
      logging: *default-logging
      volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - portainer_data:/data
      labels:
          - "traefik.enable=true"
          - "traefik.http.routers.portainer.rule=Host(`logs.iabackendjourney.com`)"
          - "traefik.http.routers.portainer.entrypoints=websecure"
          - "traefik.http.routers.portainer.tls.certresolver=le"
          - "traefik.http.services.portainer.loadbalancer.server.port=9000"

# NOTA: mailpit no se incluye aquí — es una herramienta de desarrollo.
# Configura MAIL_MAILER con un proveedor SMTP real cuando lo necesites.

volumes:
  portainer_data:
  mysql_data:
  meilisearch_data:
  qdrant_data:
  storage:
  letsencrypt:

# Red con nombre fijo para que el stack de observabilidad
# (docker-compose.observability.yml) pueda compartirla como red externa y llegar
# a mysql/redis/traefik sin acoplarse al nombre de red por defecto del proyecto.
networks:
  default:
    name: devjourney
