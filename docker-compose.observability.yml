# Stack de observabilidad (métricas + logs centralizados) para DevJourney.
#
# Independiente del docker-compose.yml principal: comparte su red (externamente
# "devjourney", definida con nombre fijo en docker-compose.yml) para que los
# exporters alcancen mysql/redis y Traefik enrute a Grafana.
#
#   docker compose -f docker-compose.observability.yml up -d
#
# Solo Grafana queda expuesto (via Traefik). Prometheus/Loki/exporters viven en
# la red interna. Las imágenes usan "latest" por comodidad; en producción conviene
# fijar versiones para builds reproducibles.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.iabackendjourney.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.iabackendjourney.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana-http.rule=Host(`grafana.iabackendjourney.com`)"
      - "traefik.http.routers.grafana-http.entrypoints=web"
      - "traefik.http.routers.grafana-http.middlewares=redirect-to-https"

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./docker/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./docker/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  redis_exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 32m
    command:
      - "--redis.addr=redis://redis:6379"

  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 32m
    environment:
      DATA_SOURCE_NAME: "devjourney:${DB_PASSWORD}@(mysql:3306)/"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    external: true
    name: devjourney
